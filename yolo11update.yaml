# Ultralytics YOLO11 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo11
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 1 # number of classes
#scales:
#  s: [0.50, 0.50, 1024] # summary: 181 layers, 9458752 parameters, 9458736 gradients, 21.7 GFLOPs
scales:
  s: [0.50, 0.50, 1024] # summary: 181 layers, 9458752 parameters, 9458736 gradients, 21.7 GFLOPs

# YOLO11n backbone
#通道数有问题
backbone:
  # [from, repeats, module, args]
  - [ -1, 1, Conv, [ 64, 3, 2 ] ]    # 0  初次下采样，浅层特征提取，输出通道64
  - [ -1, 1, Conv, [ 128, 3, 2 ] ]   # 1  二次下采样，提取中部特征，输出通道128
  - [ -1, 2, C3k2, [ 256, False, 0.25 ] ] # 2 特征聚合 输出通道数256
  - [ -1, 1, CA, [ 256, 8 ] ]        # 3：P2炮孔坐标+通道特征强化
  - [ -1, 1, Conv, [ 256, 3, 2 ] ]   # 4  三次下采样，P3基础层
  - [ -1, 2, C3k2, [ 512, False, 0.25 ] ] # 5 特征聚合 强化P3  输出为512
  - [ -1, 1, ECA, [ 512, 8 ] ]       # 6 输出512
  - [ -1, 1, Conv, [ 512, 3, 2 ] ]  # 7  四次下采样，得到P4，输出为512
  - [ -1, 2, C3k2, [ 512, True ] ]  # 8  特征聚合，强化P4
  - [ -1, 1, SAM, [ ] ]             # 9  P4炮孔边界强化+背景抑制
#  - [ -1, 1, GC, [ 1024, 8 ] ]       # 新增：P4全局背景抑制（通道数1024，压缩比8）
  - [ -1, 1, Conv, [ 1024, 3, 2 ] ]  # 10  五次下采样，得到P5，输出为1024
  - [ -1, 2, C3k2, [ 1024, True ] ]  # 11  强化P5
  - [ -1, 1, SPPF, [ 1024, 5 ] ]     # 12  融合多尺度信息
  - [ -1, 1, RFA, [ 1024, 8 ] ]      # 13  炮孔旋转不变特征强化
  - [ -1, 2, C2PSA, [ 1024 ] ]       # 14  特征增强收尾层


# YOLO11n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 15  P5上采样还原至P4
  - [[-1, 8], 1, Concat, [1]] # 16  拼接上采样P5和原P4，输出为：1024+512
  - [-1, 2, C3k2, [512, False]] # 17  压缩+聚合，压缩至512，得到P4融合层

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 18  P4融合层上采样，还原至P3
  - [[-1, 5], 1, Concat, [1]] # 19  拼接上采样P4和P3，输出为512+512
  - [-1, 2, C3k2, [256, False]] # 20  压缩+聚合，得到P3检测层（小尺度）

  - [-1, 1, Conv, [256, 3, 2]]  #21  P3检测层下采样，得到 P4
  - [[-1, 18], 1, Concat, [1]] # 22  拼接上一层和P4融合层，输出为256+512
  - [-1, 2, C3k2, [512, False]] # 23 压缩+聚合，得到P4检测层（中尺度）

  - [-1, 1, Conv, [512, 3, 2]]  # 24  P4检测层下采样，得到 P5
  - [[-1, 14], 1, Concat, [1]] # 25  拼接上一层和 backbone P5，输出为512+1024
  - [-1, 2, C3k2, [1024, True]] # 26 压缩+聚合，得到P5检测层（大尺度）

  - [[20, 23, 26], 1, Detect, [nc]] # Detect(P3, P4, P5)
