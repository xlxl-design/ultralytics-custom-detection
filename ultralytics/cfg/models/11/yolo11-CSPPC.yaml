# Ultralytics YOLO11 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo11
# Task docs: https://docs.ultralytics.com/tasks/detect
# Custom Configuration:
# 1. Replaced C3k2 with CSPPC
# 2. Removed layers 7 and 8 (P5 backbone layers)
# 3. Replaced C2PSA with EMA (at layer 10 -> now 8)
# 4. Adjusted Head to maintain 3 detection heads (now P2, P3, P4)

# Parameters
nc: 1 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, CSPPC, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, CSPPC, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, CSPPC, [512, True]] # 6
  # Layers 7 and 8 removed (P5/32)
  - [-1, 1, SPPF, [512, 5]] # 7 (was 9) Adjusted channels to 512 (P4 output)
  - [-1, 2, EMA, [512]] # 8 (was 10) Replaced C2PSA with EMA, adjusted channels to 512

# YOLO11n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 9
  - [[-1, 4], 1, Concat, [1]] # 10 cat backbone P3
  - [-1, 2, CSPPC, [512, False]] # 11

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12
  - [[-1, 2], 1, Concat, [1]] # 13 cat backbone P2
  - [-1, 2, CSPPC, [256, False]] # 14 (P2/4-small)

  - [-1, 1, Conv, [256, 3, 2]] # 15
  - [[-1, 11], 1, Concat, [1]] # 16 cat head P3
  - [-1, 2, CSPPC, [512, False]] # 17 (P3/8-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 18
  - [[-1, 8], 1, Concat, [1]] # 19 cat head P4 (EMA output)
  - [-1, 2, CSPPC, [1024, True]] # 20 (P4/16-large). Channels 1024 scaled by width.

  - [[14, 17, 20], 1, Detect, [nc]] # Detect(P2, P3, P4)

